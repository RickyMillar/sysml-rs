[package]
name = "sysml-query"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified structured query engine for SysML model element lists"
repository.workspace = true
# OSA-04: no Cargo package in this workspace publishes to crates.io at Stage A
# (first public preview ships binaries/VSIX only). Tier and rationale:
publish = false

[dependencies]
sysml-core = { workspace = true, features = ["serde", "schemars"] }
sysml-id = { workspace = true, features = ["serde", "schemars"] }
sysml-span = { workspace = true, features = ["serde", "schemars"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
