[package]
name = "sysml-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST API server for SysML v2 models"
repository.workspace = true
# OSA-04: no Cargo package in this workspace publishes to crates.io at Stage A
# (first public preview ships binaries/VSIX only). Tier and rationale:
publish = false

[dependencies]
sysml-service = { workspace = true }
sysml-store = { workspace = true }
sysml-core = { workspace = true, features = ["serde"] }
sysml-runtime = { workspace = true, features = ["serde"] }
sysml-id = { workspace = true }
sysml-lsp-server = { path = "../sysml-lsp-server" }
sysml-mcp = { path = "../sysml-mcp" }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-lsp = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = "0.2"
thiserror = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
