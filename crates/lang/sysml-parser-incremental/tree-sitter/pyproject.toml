[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-sysml"
description = "Sysml grammar for tree-sitter"
version = "0.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "sysml"]
# OSA-04: PyPI rejects any distribution carrying a `Private ::` classifier, so
# this is the PyPI equivalent of `publish = false` / npm `"private": true`. The
# grammar's registry presence (crates.io / npm / PyPI) is an open decision —
# one line; the classifier does not affect local builds or wheel construction.
classifiers = [
  "Private :: Do Not Upload",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed"
]
requires-python = ">=3.8"
# PEP 621 table form, not the PEP 639 SPDX string: `license = "MIT OR Apache-2.0"`
# needs setuptools>=77, which needs Python>=3.9, and this package is pinned to 3.8
# by requires-python and Py_LIMITED_API 0x03080000. Switch to the SPDX expression
# (and drop the License:: classifiers) when the floor moves to 3.9.
license.text = "MIT OR Apache-2.0"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/RickyMillar/sysml-rs"

[project.optional-dependencies]
core = ["tree-sitter~=0.21"]

[tool.cibuildwheel]
build = "cp38-*"
build-frontend = "build"
