# SysML v2 Visualization Pipeline Coverage Tracker
#
# Tracks every graphical concept through the 6-stage pipeline:
#   1. Parser     — tree-sitter grammar rule parses the syntax
#   2. AST        — AST builder produces correct ElementKind + properties
#   3. SModel Gen — Rust generator emits SNode/SEdge/SCompartment
#   4. TS Reg     — configureModelElement() in sysml-module.ts
#   5. View       — SVG rendering correct (shape, CSS, children)
#   6. ELK        — proper sizing, spacing, routing
#
# Status: "done" | "partial" | "stub" | "missing" | "n/a"
#
# Updated: 2026-03-16 — Phase 1 crash fixes complete
# Coverage: 37 nodes, 37 edges, 59 compartments


