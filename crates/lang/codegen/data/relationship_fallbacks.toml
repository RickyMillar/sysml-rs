# Fallback relationship constraints for source/target type validation.
#
# These are used when JSON/XMI parsing doesn't yield specific constraints
# for a relationship type. Each entry specifies the expected source and
# target element types for a relationship kind.
#
# Format:
#   [[constraint]]
#   type_name    = "RelationshipTypeName"
#   source_type  = "SourceElementType"
#   target_type  = "TargetElementType"

# === Base Relationship ===

[[constraint]]
type_name = "Relationship"
source_type = "Element"
target_type = "Element"

