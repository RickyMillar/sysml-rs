category = "cardinality"
severity = "error"
message = "A state usage may have at most one entry, one do, and one exit action"
check = "at_most_one_state_subaction"
spec_ref = "SysML 8.3.18.6 validateStateUsageStateSubactionKind"

[[rule]]
id = "S070"
