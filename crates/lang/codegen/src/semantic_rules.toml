message = "The subject must be the first parameter (input) of a requirement definition"
check = "subject_is_first_parameter"
spec_ref = "SysML 8.3.21.8 validateRequirementDefinitionSubjectParameterPosition"

[[rule]]
id = "S142"
element_type = "RequirementUsage"
category = "requirement"
severity = "error"
message = "The subject must be the first parameter (input) of a requirement usage"
check = "subject_is_first_parameter"
spec_ref = "SysML 8.3.21.9 validateRequirementUsageSubjectParameterPosition"

[[rule]]
id = "S143"
element_type = "CaseDefinition"
category = "requirement"
severity = "error"
message = "The subject must be the first parameter (input) of a case definition"
check = "subject_is_first_parameter"
spec_ref = "SysML 8.3.22.2 validateCaseDefinitionSubjectParameterPosition"

[[rule]]
id = "S144"
element_type = "CaseUsage"
category = "requirement"
severity = "error"
message = "The subject must be the first parameter (input) of a case usage"
check = "subject_is_first_parameter"
spec_ref = "SysML 8.3.22.3 validateCaseUsageSubjectParameterPosition"

[[rule]]
