# Semantic Validation Rules for SysML v2
#
# Hand-curated catalog of semantic constraints derived from:
# - KerMLValidator.xtend (pilot implementation)
# - SysMLValidator.xtend (pilot implementation)
# - KerML/SysML specification prose
#
# Each rule maps to a hand-implemented check function in
# sysml-core/src/semantic_checks/.
#
# Error codes: S001-S999 (semantic validation range)
#
# Categories:
#   distinguishability - Duplicate name detection
#   typing             - Usage/feature typing constraints
#   ownership          - Membership/ownership context rules
#   cardinality        - Member count constraints
#   specialization     - Type hierarchy constraints
#   variation          - Variation point rules
#   connector          - Connection/association rules
#   state              - State machine rules
#   action             - Action/control flow rules
#   requirement        - Requirement/case rules
#   expression         - Expression validation rules

# =====================================================================
# DISTINGUISHABILITY (Namespace)
# =====================================================================

[[rule]]
id = "S001"
element_type = "Namespace"
category = "distinguishability"
severity = "warning"
message = "Duplicate owned member name '{name}'"
check = "unique_owned_member_names"
spec_ref = "KerML 8.3.2.4.5 validateNamespaceDistinguishibility"

[[rule]]
id = "S002"
element_type = "Namespace"
category = "distinguishability"
severity = "warning"
message = "Member name '{name}' duplicates an alias"
check = "no_name_alias_conflict"
spec_ref = "KerML 8.3.2.4.5 validateNamespaceDistinguishibility"

[[rule]]
id = "S003"
element_type = "Namespace"
category = "distinguishability"
severity = "warning"
message = "Member name '{name}' conflicts with inherited member"
check = "no_inherited_name_conflict"
spec_ref = "KerML 8.3.2.4.5 validateNamespaceDistinguishibility"

# =====================================================================
# TYPING (Usage must be typed by appropriate Definitions)
# =====================================================================

[[rule]]
id = "S010"
element_type = "Usage"
category = "typing"
severity = "error"
message = "A usage must be typed by definitions"
check = "usage_typed_by_definitions"
spec_ref = "SysML 8.3.6.4"

[[rule]]
id = "S011"
element_type = "AttributeUsage"
category = "typing"
severity = "error"
message = "An attribute must be typed by attribute definitions"
check = "attribute_typed_by_datatypes"
spec_ref = "SysML 8.3.7.3"

[[rule]]
id = "S012"
element_type = "EnumerationUsage"
category = "typing"
severity = "error"
message = "An enumeration must be typed by one enumeration definition"
check = "enumeration_typed_by_one_enum_def"
spec_ref = "SysML 8.3.8.3"

[[rule]]
id = "S013"
element_type = "OccurrenceUsage"
category = "typing"
severity = "error"
message = "An occurrence must be typed by occurrence definitions"
check = "occurrence_typed_by_occurrence_defs"
spec_ref = "SysML 8.3.9.4"

[[rule]]
id = "S014"
element_type = "ItemUsage"
category = "typing"
severity = "error"
message = "An item must be typed by item definitions"
check = "item_typed_by_item_defs"
spec_ref = "SysML 8.3.10.3"

[[rule]]
id = "S015"
element_type = "PartUsage"
category = "typing"
severity = "error"
message = "A part must be typed by at least one part definition"
check = "part_typed_by_part_defs"
spec_ref = "SysML 8.3.11.3"

[[rule]]
id = "S016"
element_type = "PortUsage"
category = "typing"
severity = "error"
message = "A port must be typed by port definitions"
check = "port_typed_by_port_defs"
spec_ref = "SysML 8.3.12.6"

[[rule]]
id = "S017"
element_type = "ActionUsage"
category = "typing"
severity = "error"
message = "An action must be typed by action definitions"
check = "action_typed_by_behavior"
spec_ref = "SysML 8.3.17.4"

[[rule]]
id = "S018"
element_type = "ConnectionUsage"
category = "typing"
severity = "error"
message = "A connection must be typed by connection definitions"
check = "connection_typed_by_association"
spec_ref = "SysML 8.3.13.4"

[[rule]]
id = "S019"
element_type = "StateUsage"
category = "typing"
severity = "error"
message = "A state must be typed by state definitions"
check = "state_typed_by_state_defs"
spec_ref = "SysML 8.3.18.6"

[[rule]]
id = "S020"
element_type = "ConstraintUsage"
category = "typing"
severity = "error"
message = "A constraint must be typed by one constraint definition"
check = "constraint_typed_by_predicate"
spec_ref = "SysML 8.3.20.4"

[[rule]]
id = "S021"
element_type = "RequirementUsage"
category = "typing"
severity = "error"
message = "A requirement must be typed by one requirement definition"
check = "requirement_typed_by_one_req_def"
spec_ref = "SysML 8.3.21.9"

[[rule]]
id = "S022"
element_type = "InterfaceUsage"
category = "typing"
severity = "error"
message = "An interface must be typed by interface definitions"
check = "interface_typed_by_interface_defs"
spec_ref = "SysML 8.3.14.3"

[[rule]]
id = "S023"
element_type = "FlowUsage"
category = "typing"
severity = "error"
message = "A flow connection must be typed by flow connection definitions"
check = "flow_typed_by_interaction"
spec_ref = "SysML 8.3.16.3"

[[rule]]
id = "S024"
element_type = "CalculationUsage"
category = "typing"
severity = "error"
message = "A calculation must be typed by one calculation definition"
check = "calculation_typed_by_one_calc_def"
spec_ref = "SysML 8.3.19.3"

[[rule]]
id = "S025"
element_type = "CaseUsage"
category = "typing"
severity = "error"
message = "A case must be typed by one case definition"
check = "case_typed_by_one_case_def"
spec_ref = "SysML 8.3.22.3"

[[rule]]
id = "S026"
element_type = "AllocationUsage"
category = "typing"
severity = "error"
message = "An allocation must be typed by allocation definitions"
check = "allocation_typed_by_allocation_defs"
spec_ref = "SysML 8.3.15.3"

# =====================================================================
# SPECIALIZATION BOUNDARIES
# =====================================================================

[[rule]]
id = "S030"
element_type = "DataType"
category = "specialization"
severity = "error"
message = "A data type cannot specialize a class or association"
check = "datatype_not_specialize_class"
spec_ref = "KerML 8.3.4.1.2 validateDataTypeSpecialization"

[[rule]]
id = "S031"
element_type = "Class"
category = "specialization"
severity = "error"
message = "A class cannot specialize a data type or association"
check = "class_not_specialize_datatype"
spec_ref = "KerML 8.3.4.2.2 validateClassSpecialization"

[[rule]]
id = "S032"
element_type = "Structure"
category = "specialization"
severity = "error"
message = "A structure cannot specialize a behavior"
check = "structure_not_specialize_behavior"
spec_ref = "KerML 8.3.4.3.2 validateStructureSpecialization"

[[rule]]
id = "S033"
element_type = "Behavior"
category = "specialization"
severity = "error"
message = "A behavior cannot specialize a structure"
check = "behavior_not_specialize_structure"
spec_ref = "KerML 8.3.4.6.2 validateBehaviorSpecialization"

[[rule]]
id = "S034"
element_type = "AttributeDefinition"
category = "specialization"
severity = "error"
message = "An attribute definition cannot specialize an item definition"
check = "attribute_def_not_specialize_item_def"
spec_ref = "SysML 8.3.7.2"

[[rule]]
id = "S035"
element_type = "ItemDefinition"
category = "specialization"
severity = "error"
message = "An item definition cannot specialize an attribute definition"
check = "item_def_not_specialize_attribute_def"
spec_ref = "SysML 8.3.10.2"

# =====================================================================
# OWNERSHIP CONTEXT
# =====================================================================

[[rule]]
id = "S040"
element_type = "ParameterMembership"
category = "ownership"
severity = "error"
message = "Parameter membership is only allowed in behaviors and steps"
check = "parameter_membership_owning_type"
spec_ref = "KerML 8.3.4.6.4 validateParameterMembershipOwningType"

[[rule]]
id = "S041"
element_type = "ReturnParameterMembership"
category = "ownership"
severity = "error"
message = "Return parameter membership is only allowed in functions and expressions"
check = "return_parameter_membership_owning_type"
spec_ref = "KerML 8.3.4.7.8 validateReturnParameterMembershipOwningType"

[[rule]]
id = "S042"
element_type = "StateSubactionMembership"
category = "ownership"
severity = "error"
message = "Entry, do, and exit actions can only appear in state definitions or usages"
check = "state_subaction_owned_by_state"
spec_ref = "SysML 8.3.18.4 validateStateSubactionMembershipOwningType"

[[rule]]
id = "S043"
element_type = "SubjectMembership"
category = "ownership"
severity = "error"
message = "Only requirements and cases can have subjects"
check = "subject_membership_in_req_or_case"
spec_ref = "SysML 8.3.21.11 validateSubjectMembershipOwningType"

[[rule]]
id = "S044"
element_type = "ObjectiveMembership"
category = "ownership"
severity = "error"
message = "Only cases can have objectives"
check = "objective_membership_in_case"
spec_ref = "SysML 8.3.22.4 validateObjectiveMembershipOwningType"

[[rule]]
id = "S045"
element_type = "ActorMembership"
category = "ownership"
severity = "error"
message = "Only requirements and cases can have actors"
check = "actor_membership_in_req_or_case"
spec_ref = "SysML 8.3.21.2 validateActorMembershipOwningType"

[[rule]]
id = "S046"
element_type = "StakeholderMembership"
category = "ownership"
severity = "error"
message = "Only requirements can have stakeholders"
check = "stakeholder_membership_in_requirement"
spec_ref = "SysML 8.3.21.12 validateStakeholderMembershipOwningType"

[[rule]]
id = "S047"
element_type = "RequirementConstraintMembership"
category = "ownership"
severity = "error"
message = "Only requirements can have assumed or required constraints"
check = "requirement_constraint_in_requirement"
spec_ref = "SysML 8.3.21.7 validateRequirementConstraintMembershipOwningType"

[[rule]]
id = "S048"
element_type = "ViewRenderingMembership"
category = "ownership"
severity = "error"
message = "Only views can have view renderings"
check = "view_rendering_in_view"
spec_ref = "SysML 8.3.26.10 validateViewRenderingMembershipOwningType"

[[rule]]
id = "S049"
element_type = "TransitionFeatureMembership"
category = "ownership"
severity = "error"
message = "Transition feature membership is only allowed in transitions"
check = "transition_feature_in_transition"
spec_ref = "SysML 8.3.18.8 validateTransitionFeatureMembershipOwningType"

[[rule]]
id = "S050"
element_type = "VariantMembership"
category = "ownership"
severity = "error"
message = "A variant must be an owned member of a variation"
check = "variant_membership_in_variation"
spec_ref = "SysML 8.3.6.5 validateVariantMembershipOwningNamespace"

[[rule]]
id = "S051"
element_type = "ResultExpressionMembership"
category = "ownership"
severity = "error"
message = "Result expression membership is only allowed in functions and expressions"
check = "result_expression_in_function_or_expression"
spec_ref = "KerML 8.3.4.7.7 validateResultExpressionMembershipOwningType"

