spec_ref = "SysML 8.3.26.7 validateViewDefinitionOnlyOneViewRendering"

[[rule]]
id = "S071"
element_type = "ViewUsage"
category = "cardinality"
severity = "error"
message = "A view usage may have at most one view rendering"
check = "at_most_one_view_rendering"
spec_ref = "SysML 8.3.26.11 validateViewUsageOnlyOneViewRendering"

# =====================================================================
# CONNECTOR & ASSOCIATION
# =====================================================================

[[rule]]
id = "S100"
element_type = "Connector"
category = "connector"
severity = "error"
message = "A binary connector must have exactly two end features"
check = "binary_connector_two_ends"
spec_ref = "KerML 8.3.4.5.3 validateConnectorRelatedFeatures"

[[rule]]
id = "S101"
element_type = "BindingConnector"
category = "connector"
severity = "error"
message = "A binding connector must have exactly two end features"
check = "binding_connector_two_ends"
spec_ref = "KerML 8.3.4.5.2 validateBindingConnectorIsBinary"

[[rule]]
id = "S102"
element_type = "ConnectionUsage"
category = "connector"
severity = "error"
message = "A connection must have at least two end features"
check = "connection_has_ends"
spec_ref = "SysML 8.3.13.4"

[[rule]]
id = "S103"
element_type = "InterfaceUsage"
category = "connector"
severity = "error"
message = "An interface must have at least two end features"
check = "interface_has_ends"
spec_ref = "SysML 8.3.14.3"

[[rule]]
id = "S104"
element_type = "AllocationUsage"
category = "connector"
severity = "error"
message = "An allocation must have at least two end features"
check = "allocation_has_ends"
spec_ref = "SysML 8.3.15.3"

[[rule]]
id = "S105"
element_type = "Succession"
category = "connector"
severity = "error"
message = "A succession must have exactly two end features"
check = "succession_two_ends"
spec_ref = "KerML 8.3.4.5.4"

[[rule]]
id = "S106"
element_type = "ConnectionUsage"
category = "connector"
severity = "warning"
message = "A connection must be owned by a type (part, action, etc.), not a package"
check = "connector_owned_by_type"
spec_ref = "KerML 8.3.4.5.3"

[[rule]]
id = "S107"
element_type = "InterfaceUsage"
category = "connector"
severity = "warning"
message = "An interface must be owned by a type (part, action, etc.), not a package"
check = "connector_owned_by_type"
spec_ref = "KerML 8.3.4.5.3"

[[rule]]
id = "S108"
element_type = "FlowUsage"
category = "connector"
severity = "warning"
message = "A flow must be owned by a type (part, action, etc.), not a package"
check = "connector_owned_by_type"
spec_ref = "KerML 8.3.4.5.3"

# =====================================================================
# STATE MACHINE
# =====================================================================

[[rule]]
id = "S110"
element_type = "StateDefinition"
category = "state"
severity = "error"
message = "A parallel state cannot have transitions"
check = "parallel_state_no_transitions"
spec_ref = "SysML 8.3.18.5 validateStateDefinitionParallelSubactions"

[[rule]]
id = "S111"
element_type = "StateUsage"
category = "state"
severity = "error"
message = "A parallel state cannot have transitions"
check = "parallel_state_no_transitions"
spec_ref = "SysML 8.3.18.6 validateStateUsageParallelSubactions"

[[rule]]
id = "S112"
element_type = "TransitionUsage"
category = "state"
severity = "error"
message = "A transition must be owned by a state or an action"
check = "transition_owned_by_state_or_action"
spec_ref = "SysML 8.3.18.9"

[[rule]]
id = "S113"
element_type = "TransitionUsage"
category = "state"
severity = "error"
message = "A transition must have a source"
check = "transition_has_source"
spec_ref = "SysML 8.3.18.9"

[[rule]]
id = "S114"
element_type = "ExhibitStateUsage"
category = "state"
severity = "error"
message = "An exhibit state must be typed by exactly one state definition"
check = "exhibit_state_one_type"
spec_ref = "SysML 8.3.18.2"

