element_type = "ForkNode"
category = "action"
severity = "error"
message = "A fork node must have at most one incoming succession"
check = "fork_node_one_incoming"
spec_ref = "SysML 8.3.17.8 validateForkNodeIncomingSuccessions"

[[rule]]
id = "S123"
element_type = "JoinNode"
category = "action"
severity = "error"
message = "A join node must have at most one outgoing succession"
