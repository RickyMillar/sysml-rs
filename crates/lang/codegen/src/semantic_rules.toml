[[rule]]
id = "S146"
element_type = "PortDefinition"
category = "port"
severity = "error"
message = "The non-port owned usages of a port definition must be referential (non-composite)"
check = "port_definition_owned_usages_referential"
spec_ref = "SysML 8.3.12.5 validatePortDefinitionOwnedUsagesNotComposite"

[[rule]]
id = "S064"
element_type = "CaseDefinition"
category = "cardinality"
severity = "error"
message = "A case definition can have at most one objective"
check = "at_most_one_objective"
spec_ref = "SysML 8.3.22.2 validateCaseDefinitionOnlyOneObjective"

[[rule]]
id = "S065"
element_type = "CaseUsage"
category = "cardinality"
severity = "error"
message = "A case usage can have at most one objective"
check = "at_most_one_objective"
spec_ref = "SysML 8.3.22.3 validateCaseUsageOnlyOneObjective"

[[rule]]
