# DROPPED — sysml-specification.pdf (OS-D2 owner decision 5).
#
# `references/sysmlv2/sysml-specification.pdf` is the OMG *API & Services*
# specification, not the language spec, and no code reads it: it is absent from
# spec-drop.toml and cited by nothing. It was also the one item that could not
# be pinned — OMG re-rendered the PDF in place at its stable URL, so a fetch
# served different bytes than the vendored copy and the item failed by
# construction. Keeping it meant either a permanently red item or a checksum
# upstream could invalidate again without notice, so it is out of the fetch set
# rather than re-pinned.
#
# Humans who want the document download it from the OMG specification page:
#   https://www.omg.org/spec/SystemsModelingAPI/1.0/PDF
# (index: https://www.omg.org/spec/SystemsModelingAPI/1.0/)
#
# Nothing replaces it here. If a future item needs the API spec, pin the
# versioned artifact rather than the "/1.0/PDF" alias.
