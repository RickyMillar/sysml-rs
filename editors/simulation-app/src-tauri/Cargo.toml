[package]
name = "sysml-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# OSA-04: no Cargo package in this workspace publishes to crates.io at Stage A
# (first public preview ships binaries/VSIX only). Tier and rationale:
publish = false

[lib]
name = "sysml_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
sysml-service = { workspace = true }
sysml-api = { workspace = true }

[lints]
workspace = true
