name: Simulation App

on:
  push:
    paths:
      - 'editors/simulation-app/**'
      - 'editors/expression-view/**'
  pull_request:
    paths:
      - 'editors/simulation-app/**'
      - 'editors/expression-view/**'

# Least privilege: these jobs only read the repository. The release workflow is
# the one place that needs `contents: write`, and it declares that itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # The expression-view lock must be generated by npm 10: npm 11 silently
      # drops the top-level @emnapi entries that npm 10's `npm ci` fails closed
      # on, and a lock written by the older major satisfies both. Pinning here
      # keeps CI on the stricter major, so a lock regenerated under npm 11
      # cannot pass unnoticed. Covers both `npm ci` calls in this job.
      - name: Pin npm
        run: npm install -g npm@10

      # expression-view is a file: dependency — install and build it first
      - name: Install expression-view
        run: cd editors/expression-view && npm ci

      - name: Build expression-view
        run: cd editors/expression-view && npm run build

      - name: Expression-view tests
        run: cd editors/expression-view && npm test

      - name: Install simulation-app
        run: cd editors/simulation-app && npm ci

      - name: Typecheck
        run: cd editors/simulation-app && npm run typecheck

      - name: Unit tests
        run: cd editors/simulation-app && npm test

      - name: Install Playwright browsers
        run: cd editors/simulation-app && npx playwright install --with-deps chromium

      - name: E2E smoke tests (legacy shell, flag pinned off)
        run: cd editors/simulation-app && npx playwright test --project=smoke

      # THE FLIP (ninebar Phase 3): the ninebar shell is default-on and
      # its Playwright project is BLOCKING from here on.
      - name: E2E ninebar shell tests
        run: cd editors/simulation-app && npx playwright test --project=ninebar
