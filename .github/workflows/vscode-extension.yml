name: VS Code Extension CI

on:
  push:
    paths:
      - 'editors/vscode/**'
      - 'crates/lang/sysml-parser-incremental/tree-sitter/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Cancel in-progress runs for the same branch+event (so push runs don't cancel dispatch runs)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository. The release workflow is
# the one place that needs `contents: write`, and it declares that itself.
permissions:
  contents: read

jobs:
  # ---------- Test (TypeScript only, fast) ----------
  # The extension is a lightweight LSP-only client — no webview, no diagram
  # dependency. Tests are: tsc typecheck, eslint, and TextMate grammar tests.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # Locks must be generated by npm 10: npm 11 silently drops the top-level
      # @emnapi entries that npm 10's `npm ci` fails closed on, and a lock
      # written by the older major satisfies both majors.
      - name: Pin npm
        run: npm install -g npm@10

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Grammar tests
        run: npm run test:grammar

  # ---------- Generate tree-sitter parser (once, shared) ----------
  # Generates `generated/{keywords,operators,enums}.js` from the Xtext grammars
  # (these are gitignored and must be produced before `tree-sitter generate`),
  # then runs `tree-sitter generate` to emit `src/parser.c` (also gitignored).
  generate-parser:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/lang/sysml-parser-incremental/tree-sitter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # `tree-sitter generate` is the single biggest time sink in this workflow,
      # so a hit here skips the fetch and both generation steps below and goes
      # straight to the upload. That makes the key safety-critical: a stale
      # parser.c served past a grammar change is a silent wrong-parser bug, not
      # a build failure. The key therefore over-keys deliberately — it covers
      # the whole generation closure, and anything not listed here must not be
      # able to change the output.
      #
      #   grammar.js, rules/**, helpers/**  the grammar itself
      #   generated/*.js                    committed token modules grammar.js
      #                                     require()s (they are INPUTS)
      #   generate_from_xtext.sh            regenerates those from the Xtext
      #   manifest.toml                     pins the Xtext the script reads
      #   tree-sitter.json, package.json    CLI configuration
      #   src/tree_sitter/**                the tracked headers that ship in
      #                                     the same artifact as parser.c
      #   both workflow files               each holds a tree-sitter-cli pin AND
      #                                     the generate flags (--abi 14)
      #
      # This key expression is duplicated LITERALLY in resolve-lock-fixtures.yml
      # so the two workflows share one cache entry. Parity is load-bearing: edit
      # both or neither. Both workflow paths are in the hash list for the same
      # reason — either file can bump the CLI pin, and a bump that did not bust
      # this key would serve a parser built by a different compiler version.
      #
      # Only the three generated files are cached. The headers under
      # src/tree_sitter/ are git-tracked, so they come from the checkout and a
      # restore can never overwrite them with an older copy.
      - name: Cache generated parser
        id: parser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            crates/lang/sysml-parser-incremental/tree-sitter/src/parser.c
            crates/lang/sysml-parser-incremental/tree-sitter/src/grammar.json
            crates/lang/sysml-parser-incremental/tree-sitter/src/node-types.json
          # No restore-keys: a near-miss must regenerate, never approximate.
          key: >-
            ts-parser-${{ runner.os }}-${{ hashFiles(
            'crates/lang/sysml-parser-incremental/tree-sitter/grammar.js',
            'crates/lang/sysml-parser-incremental/tree-sitter/rules/**',
            'crates/lang/sysml-parser-incremental/tree-sitter/helpers/**',
            'crates/lang/sysml-parser-incremental/tree-sitter/generated/*.js',
            'crates/lang/sysml-parser-incremental/tree-sitter/src/tree_sitter/**',
            'crates/lang/sysml-parser-incremental/tree-sitter/tree-sitter.json',
            'crates/lang/sysml-parser-incremental/tree-sitter/package.json',
            'crates/lang/sysml-parser-incremental/tree-sitter/generate_from_xtext.sh',
            'tools/fetch-references/manifest.toml',
            '.github/workflows/vscode-extension.yml',
            '.github/workflows/resolve-lock-fixtures.yml') }}

      # Skipped entirely when the parser cache hits — nothing else in this job
      # reads the reference tree.
      - name: Cache fetched references
        if: steps.parser-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: references/sysmlv2/SysML-v2-Pilot-Implementation
          key: refs-grammar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch-references/manifest.toml') }}
          restore-keys: |
            refs-grammar-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch pinned references (Xtext grammars)
        if: steps.parser-cache.outputs.cache-hit != 'true'
        # The three grammars live in the pilot tree, which is not vendored;
        # fetch.sh reconstructs it from the pinned commit and verifies it.
        # Manifest items are whole trees, so the entire pilot repository comes
        # down for three grammar files. If that gets too slow, the fix is a
        # manifest item for the grammar subset, not path-level fetching.
        # No step here resolves stdlib types, so standard-library is not fetched.
        #
        # Running this AFTER the cache restore is what makes the cache safe:
        # fetch verifies every restored item against the manifest checksum and
        # re-fetches on any mismatch, so a stale or corrupted cache entry cannot
        # survive this step. A warm cache does no network work at all.
        working-directory: ${{ github.workspace }}
        run: tools/fetch-references/fetch.sh fetch --item pilot-implementation

      - name: Generate tree-sitter constants from Xtext
        if: steps.parser-cache.outputs.cache-hit != 'true'
        env:
          SYSML_REFS_DIR: ${{ github.workspace }}/references/sysmlv2
        run: ./generate_from_xtext.sh

      - name: Generate tree-sitter parser (C)
        if: steps.parser-cache.outputs.cache-hit != 'true'
        run: |
          npm install -g tree-sitter-cli@0.26.5
          tree-sitter generate --abi 14

      - name: Upload parser artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tree-sitter-generated
          path: crates/lang/sysml-parser-incremental/tree-sitter/src/
          retention-days: 1

  # ---------- Build LSP server per platform (release) ----------
  # Uses native runners wherever possible (free ARM Linux runners are GA for
  # public repos — ubuntu-24.04-arm). darwin-x64 is cross-compiled from the
  # arm64 macos-latest runner (the Apple linker handles x86_64-apple-darwin
  # natively; macos-13 x64 is being retired — GH changelog 2025-09-19).
  #
  # Legs with a `cli-artifact` also build the `sysml` CLI (crates/tooling/
  # sysml-cli) so the release can ship it alongside the server binaries — the
  # companion book's "Getting the tool" appendix and its CI both download it.
  # Same job rather than a separate matrix because the CLI shares almost the
  # whole dependency graph with the server, so the extra build is incremental.
  # win32 deliberately has no cli-artifact yet: the CLI has never been built
  # for MSVC, and an untested leg must not be able to sink a release.
  build-server:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    needs: [generate-parser]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sysml-lsp-server
            cli-artifact: sysml
            vsix-target: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: sysml-lsp-server
            cli-artifact: sysml
            vsix-target: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sysml-lsp-server
            cli-artifact: sysml
            vsix-target: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sysml-lsp-server
            cli-artifact: sysml
            vsix-target: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sysml-lsp-server.exe
            vsix-target: win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Keyed on the manifest, so a pin bump misses and re-fetches. runner.os and
      # runner.arch are in the key even though the content is platform-independent
      # text: the cache scope is the repository, not the platform, so without them
      # one platform's tree could be served to another. That matters because
      # core.autocrlf is pinned off for the Windows fetch below — if that pin is
      # ever lost, the resulting CRLF tree stays quarantined to Windows instead of
      # poisoning the Linux and macOS legs.
      #
      # Paths are the manifest destinations rather than references/sysmlv2 whole,
      # so a restore can only overwrite fetch-managed content — never the
      # git-tracked derived/ and spec-drop.toml that live alongside it.
      - name: Cache fetched references
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            references/sysmlv2/SysML-v2-Pilot-Implementation
            references/sysmlv2/SysML-v2-API-Services
            references/sysmlv2/Kerml-Vocab.ttl
            references/sysmlv2/SysML-vocab.ttl
            references/sysmlv2/KerML-shapes.ttl
            references/sysmlv2/SysML-shapes.ttl
            references/sysmlv2/KerML/20250201/KerML.xmi
            references/sysmlv2/SysML/20250201/SysML.xmi
          key: refs-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch-references/manifest.toml') }}
          restore-keys: |
            refs-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch only build-required pinned references
        # Only what the build actually reads: the pilot tree (three Xtext
        # grammars), the API-Services metamodel schemas, and the vocab/shape/
        # XMI files consumed by sysml-core's build script.
        #
        # Runs after the cache restore above, and verifies every restored item
        # against its manifest checksum before accepting it — a stale or
        # corrupted cache entry is re-fetched rather than used. On a warm cache
        # this does no network work.
        #
        # standard-library is deliberately absent. This job only runs `cargo
        # build`; the standard model library is resolved at RUNTIME (from
        # SYSML_LIBRARY_PATH, else ./libraries/standard), never at build time,
        # and the LSP conformance tests that would load it are #[cfg(test)].
        # Add `--item standard-library` here if this job ever grows a test step
        # — post-rewrite the tree has no libraries/standard until fetch runs.
        shell: bash
        env:
          # fetch.sh clones into a scratch tree and hashes the result against
          # the manifest, so any line-ending rewrite on the Windows leg would
          # fail the checksum. Pin it off rather than rely on runner defaults.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          tools/fetch-references/fetch.sh fetch \
            --item pilot-implementation \
            --item api-services \
            --item kerml-vocab --item sysml-vocab \
            --item kerml-shapes --item sysml-shapes \
            --item kerml-xmi --item sysml-xmi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Download tree-sitter parser
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tree-sitter-generated
          path: crates/lang/sysml-parser-incremental/tree-sitter/src/

      - name: Build LSP server (release)
        run: cargo build --release --target ${{ matrix.target }} -p sysml-lsp-server

      # Incremental over the server build above — it reuses the shared
      # dependency graph and compiles only the CLI crate itself.
      - name: Build sysml CLI (release)
        if: matrix.cli-artifact
        run: cargo build --release --target ${{ matrix.target }} -p sysml-cli

      - name: Upload server binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-${{ matrix.vsix-target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload CLI binary
        if: matrix.cli-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.vsix-target }}
          path: target/${{ matrix.target }}/release/${{ matrix.cli-artifact }}
          if-no-files-found: error

  # ---------- Package platform-specific VSIX ----------
  # The lightweight extension bundles to a single dist/extension.js (no webview,
  # no WASM). Each platform VSIX ships its native sysml-lsp-server in server/
  # so the extension can launch it directly (serverBinary.ts discovery priority:
  # setting → bundled → PATH → install-from-releases).
  package:
    needs: [test, build-server]
    strategy:
      matrix:
        include:
          - vsix-target: linux-x64
            binary: sysml-lsp-server
          - vsix-target: linux-arm64
            binary: sysml-lsp-server
          - vsix-target: darwin-arm64
            binary: sysml-lsp-server
          - vsix-target: darwin-x64
            binary: sysml-lsp-server
          - vsix-target: win32-x64
            binary: sysml-lsp-server.exe

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # Locks must be generated by npm 10: npm 11 silently drops the top-level
      # @emnapi entries that npm 10's `npm ci` fails closed on, and a lock
      # written by the older major satisfies both majors.
      - name: Pin npm
        run: npm install -g npm@10

      - name: Install dependencies
        run: npm ci

      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-${{ matrix.vsix-target }}
          path: editors/vscode/server/

      - name: Make binary executable
        if: matrix.vsix-target != 'win32-x64'
        run: chmod +x server/${{ matrix.binary }}

      - name: Package platform-specific VSIX
        run: npx @vscode/vsce package --no-dependencies --target ${{ matrix.vsix-target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix-${{ matrix.vsix-target }}
          path: editors/vscode/*.vsix
          retention-days: 30