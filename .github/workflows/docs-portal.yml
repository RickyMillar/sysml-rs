name: docs-portal

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs-portal.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-portal-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  # Match the Book repository's own build toolchain.
  MDBOOK_VERSION: "0.5.2"
  MDBOOK_TABS_VERSION: "0.3.4"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Cache cargo-installed binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin
          key: mdbook-${{ env.MDBOOK_VERSION }}-tabs-${{ env.MDBOOK_TABS_VERSION }}
      - name: Install mdBook and the tabs preprocessor
        run: |
          set -euo pipefail
          command -v mdbook      || cargo install mdbook      --version "${MDBOOK_VERSION}" --locked
          command -v mdbook-tabs || cargo install mdbook-tabs --version "${MDBOOK_TABS_VERSION}" --locked
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build the pinned Book into /learn/
        run: bash scripts/build-learn.sh
      - name: Build (fails on broken internal links)
        run: npm run build
      - name: Accessibility smoke check
        run: npm run a11y
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
