    "calc_constraint_conformance.sysml", # Calculation and constraint conformance checks
    "clean.sysml",                       # Minimal clean file (baseline for zero-diagnostic tests)
    "comprehensive.sysml",              # Comprehensive model exercising many element kinds
    "connectors_and_allocations.sysml",  # Connector bindings and allocation relationships
    "constraints_and_requirements.sysml", # Constraint expressions and requirement text
    "domain_library_conformance.sysml",  # Domain library usage and conformance
    "duplicate_name_different_scope.sysml", # Name scoping: same name in different packages (valid)
    "enums_and_calculations.sysml",      # Enumeration definitions and calculation expressions
    "flows_and_messages.sysml",          # Flow connections and message passing
    "ports_and_interfaces.sysml",        # Port definitions, interface blocks, conjugation
    "qualified_name_resolution.sysml",   # Qualified name resolution across packages
    "requirement_case_conformance.sysml", # Requirement and use case conformance
    "sensemetry.sysml",                  # Real-world package from Sensmetry Advent series
    "simple_vehicle.sysml",             # Simple vehicle model (constraint violation test)
    "state_machine_conformance.sysml",   # State machine conformance validation
    "state_machine.sysml",              # State machine definitions and transitions
    "stdlib_dependent.sysml",            # Model depending on standard library types
    "stdlib_type_resolution.sysml",      # Standard library type resolution paths
    "systems_library_conformance.sysml", # Systems library conformance checks
    "use_case_conformance.sysml",        # Use case conformance validation
    "view_rendering_conformance.sysml",  # View rendering and viewpoint conformance
]

[directories.lsp-invalid]
path = "crates/tooling/sysml-lsp-server/fixtures/invalid"
description = "Intentionally broken .sysml files for diagnostic and error-recovery testing"
files = [
    "corrupted_line.sysml",         # Corrupted/garbage content mid-file
    "duplicate_names.sysml",        # Duplicate element names in same scope
    "extra_brace.sysml",            # Extra closing brace (syntax error)
    "missing_import.sysml",         # Reference to unimported element
    "missing_semicolon.sysml",      # Missing semicolon (syntax error)
    "ownership_violation.sysml",    # Invalid ownership relationship
    "redefine_missing_target.sysml", # Redefine of non-existent member
    "specialization_boundary.sysml", # Invalid specialization across type boundaries
    "typo_reference.sysml",         # Typo in qualified name reference
    "unclosed_brace.sysml",         # Unclosed brace (syntax error)
    "unterminated_comment.sysml",   # Unterminated block comment
    "wrong_typing.sysml",           # Type mismatch in typing relationship
]

[directories.lsp-regression]
path = "crates/tooling/sysml-lsp-server/fixtures/regression"
description = "Regression test fixtures for previously-reported LSP bugs"
files = [
    "cascading.sysml",                       # Cascading error propagation regression
    "error_recovery_following_items.sysml",   # Items after syntax error should still parse
    "partial_edit.sysml",                     # Partial edit mid-element regression
]

