# Test Fixture Manifest
# Machine-readable catalog of all test fixtures in the sysml-rs project.
# Updated: 2026-03-17

# =============================================================================
# Shared cross-crate fixtures
# =============================================================================

[directories.shared]
path = "tests/fixtures/shared"
description = "Cross-crate .sysml fixtures used by multiple test suites"
files = [
    # Used by: sysml-lsp-server (diagnostic_ux_tests, feature_tests), sysml-cli (inspect)
    "sensemetry.sysml",          # Real-world package with stdlib-qualified units/types (from Sensmetry Advent Day 23)

    # Used by: sysml-lsp-server (diagnostic_ux_tests), sysml-cli (cli_integration, symlink)
    "simple_vehicle.sysml",      # Constraint violation diagnostics, hover, code lenses

    # Used by: sysml-lsp-server (diagnostic_ux_tests)
    "sysml-rs-model.sysml",     # Large multi-package model of the sysml-rs project itself

    # Used by: sysml-lsp-server (diagnostic_ux_tests), sysml-cli (symlink)
    "test_action.sysml",         # Action execution and visualization

    # Used by: sysml-lsp-server (diagnostic_ux_tests)
    "test_all_features.sysml",   # Smoke test exercising every major LSP feature

    # Used by: sysml-lsp-server (diagnostic_ux_tests), sysml-cli (symlink)
    "test_flow.sysml",           # Flow visualization

    # Used by: sysml-lsp-server (diagnostic_ux_tests)
    "test_health_diagnostics.sysml", # Health diagnostics showcase (AX / FL / VC categories)

    # Used by: sysml-lsp-server (diagnostic_ux_tests)
    "test_hover.sysml",          # Hover information display

    # Used by: sysml-lsp-server (diagnostic_ux_tests, protocol_tests)
    "test_whatif.sysml",         # What-If analysis and parameter sweep
]

